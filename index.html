:root {
  --panel: #c6c6c6; --hi: #ffffff; --lo: #555555;
  --slot: #8b8b8b; --slot-lo: #373737;
  --ink: #404040; --yellow: #ffff55;
  --btn: #6f6f6f; --btn-hi: #a5a5a5; --btn-lo: #3b3b3b; --btn-hover: #7483c8;
  --notch: polygon(0 4px, 4px 4px, 4px 0, calc(100% - 4px) 0, calc(100% - 4px) 4px, 100% 4px, 100% calc(100% - 4px), calc(100% - 4px) calc(100% - 4px), calc(100% - 4px) 100%, 4px 100%, 4px calc(100% - 4px), 0 calc(100% - 4px));
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--panel); font-family: "Monocraft", "Courier New", monospace; font-size: 15px; line-height: 1.4; color: var(--ink); display: flex; flex-direction: column; }
header, .block, dialog form {
  background: var(--panel); border: 4px solid #000;
  box-shadow: inset 4px 4px 0 var(--hi), inset -4px -4px 0 var(--lo);
  clip-path: var(--notch);
}
header { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 14px 18px; margin: 8px; }
header h1 { font-size: 18px; font-weight: 400; margin: 0 auto 0 0; }
.status { color: var(--lo); }
button {
  font: inherit; color: #e0e0e0; background: var(--btn); padding: 7px 18px; border: 4px solid #000;
  box-shadow: inset 4px 4px 0 var(--btn-hi), inset -4px -4px 0 var(--btn-lo);
  text-shadow: 2px 2px 0 #3f3f3f; cursor: pointer; border-radius: 0;
}
button:hover:not(:disabled) { background: var(--btn-hover); color: var(--yellow); }
button:active:not(:disabled) { box-shadow: inset 4px 4px 0 var(--btn-lo), inset -4px -4px 0 var(--btn-hi); }
button:disabled { color: #a0a0a0; cursor: not-allowed; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }
main { flex: 1; padding: 28px 30px 40px; display: flex; flex-wrap: wrap; gap: 28px; align-content: flex-start; }
.empty { margin: auto; max-width: 520px; color: var(--ink); text-align: center; font-size: 16px; }

/* ---- block ---- */
.block { position: relative; width: 200px; height: 80px; padding: 10px 14px; overflow: hidden; display: flex; flex-direction: column; gap: 10px; }
.head { height: 40px; flex: none; display: flex; align-items: center; gap: 10px; overflow: hidden; line-height: 1.2; overflow-wrap: anywhere; }
.head img { width: 40px; height: 40px; flex: none; object-fit: contain; image-rendering: pixelated; }
.body { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: start; }
.col { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.io { display: flex; align-items: center; gap: 6px; white-space: nowrap; font-size: 12px; }
.su { position: relative; width: 36px; height: 36px; flex: none; background: var(--slot); display: grid; place-items: center;
  border: 2px solid; border-color: var(--slot-lo) var(--hi) var(--hi) var(--slot-lo); }
.su img { width: 32px; height: 32px; object-fit: contain; image-rendering: pixelated; position: relative; z-index: 1; }
.su .letter { color: #fff; text-shadow: 2px 2px 0 #3f3f3f; font-size: 14px; }
.su.fluid, .su.energy { background: #2b2b2b; }
.su.fluid::after, .su.energy::after { content: ""; position: absolute; left: 3px; right: 3px; bottom: 3px; height: 70%; }
.su.fluid::after { background: linear-gradient(#6a9bff, #2f5fd0); }
.su.energy::after { background: linear-gradient(#ff6a4d, #b3151b); }
.su.has-img::after { display: none; }
.su.fluid.has-img, .su.energy.has-img { background-size: 20px 20px; background-repeat: repeat; image-rendering: pixelated; }
.su.fluid .cnt, .su.energy .cnt { writing-mode: vertical-rl; transform: rotate(180deg); right: auto; left: 4px; bottom: 4px; }
.arrow { align-self: center; position: relative; width: 26px; height: 16px; }
.uibox .arrow, .ui-canvas .arrow { position: absolute; align-self: auto; pointer-events: none; }
.arrow::before { content: ""; position: absolute; left: 0; top: 5px; width: 16px; height: 6px; background: #7a7a7a; }
.arrow::after { content: ""; position: absolute; left: 16px; top: 0; border-top: 8px solid transparent; border-bottom: 8px solid transparent; border-left: 10px solid #7a7a7a; }

/* ---- dialog ---- */
dialog { padding: 0; border: 0; background: none; color: var(--ink); font: inherit; max-width: calc(100% - 24px); overflow: visible; }
dialog::backdrop { background: rgba(0,0,0,.6); }
dialog form { width: 470px; max-width: 100%; max-height: calc(100vh - 24px); overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
dialog h2 { font-size: 18px; font-weight: 400; margin: 0; }
dialog h3 { font-size: 15px; font-weight: 400; margin: 0 0 6px; }
dialog label { display: flex; flex-direction: column; gap: 6px; }
dialog input[type="text"], dialog input[type="number"], dialog select {
  font: inherit; width: 100%; padding: 5px 8px; color: #e0e0e0; background: #000; border: 3px solid #a0a0a0; border-radius: 0; }
dialog input:focus, dialog select:focus { border-color: #fff; outline: none; }
.size-row { display: flex; gap: 12px; }
.size-row label { flex: 1; }
.icons { display: grid; grid-template-columns: repeat(auto-fill, 52px); max-height: 190px; overflow-y: auto; margin-top: 6px;
  background: var(--slot); border: 3px solid; border-color: var(--slot-lo) var(--hi) var(--hi) var(--slot-lo); }
.icons:empty { display: none; }
.icons button { width: 52px; height: 52px; padding: 0; background: var(--slot); text-shadow: none; box-shadow: none;
  border: 3px solid; border-color: var(--slot-lo) var(--hi) var(--hi) var(--slot-lo); display: grid; place-items: center; }
.icons button:hover { background: #b4b4b4; }
.icons button[aria-pressed="true"] { outline: 4px solid var(--yellow); outline-offset: -4px; background: #b4b4b4; }
.icons img { width: 32px; height: 32px; object-fit: contain; image-rendering: pixelated; }
.hint { color: var(--lo); min-height: 1.4em; margin-top: 4px; overflow-wrap: anywhere; }
.actions { display: flex; gap: 10px; justify-content: flex-end; }

.uibox { position: relative; flex: none; margin: 0 auto; }
header .gap { flex: 1; }
#ui-dlg form { width: 540px; }
.sides { display: flex; justify-content: space-between; margin-bottom: -8px; color: var(--lo); font-size: 13px; }
.canvas-wrap { overflow: auto; padding: 2px; }
.ui-canvas { position: relative; flex: none; margin: 0 auto; touch-action: none;
  background-color: #b0b0b0;
  background-image: linear-gradient(rgba(0,0,0,.07) 1px, transparent 1px), linear-gradient(90deg, rgba(0,0,0,.07) 1px, transparent 1px);
  background-size: 12px 12px;
  border: 3px solid; border-color: var(--slot-lo) var(--hi) var(--hi) var(--slot-lo); }

/* ---- pieces (used in blocks and in the editor) ---- */
.uibox > .piece, .ui-canvas > .piece { position: absolute; }
.piece { user-select: none; -webkit-user-select: none; }
.cnt { position: absolute; right: 2px; bottom: 0; z-index: 2; font-size: 12px; line-height: 1.1; color: #fff;
  text-shadow: 2px 2px 0 #3f3f3f; pointer-events: none; }
.pbtn { display: grid; place-items: center; padding: 0 6px; font-size: 12px; white-space: nowrap; overflow: hidden; cursor: default;
  background: var(--btn); color: #e0e0e0; text-shadow: 2px 2px 0 #3f3f3f; border: 3px solid #000;
  box-shadow: inset 3px 3px 0 var(--btn-hi), inset -3px -3px 0 var(--btn-lo); }
.parrow, .pflame { position: relative; filter: drop-shadow(1px 0 0 #373737) drop-shadow(-1px 0 0 #373737) drop-shadow(0 1px 0 #373737) drop-shadow(0 -1px 0 #373737); }
.pi { position: absolute; inset: 0; background: #8b8b8b; overflow: hidden; }
.parrow .pi { clip-path: polygon(0 32%, 62% 32%, 62% 0, 100% 50%, 62% 100%, 62% 68%, 0 68%); }
.parrow .pf { position: absolute; left: 0; top: 0; bottom: 0; background: #fff; }
.pflame .pi { background: #4a4a4a; clip-path: polygon(50% 0, 68% 22%, 88% 46%, 92% 74%, 76% 100%, 24% 100%, 8% 74%, 14% 46%, 32% 28%, 42% 46%); }
.pflame .pf { position: absolute; left: 0; right: 0; bottom: 0; background: linear-gradient(#ffd23f, #ff8a1c 55%, #d62d00);
  transform-origin: bottom; animation: flick .8s steps(2) infinite alternate; }
@keyframes flick { from { filter: brightness(1); transform: scaleY(1); } to { filter: brightness(1.3); transform: scaleY(.96); } }
@media (prefers-reduced-motion: reduce) { .pflame .pf { animation: none; } }

/* ---- UI editor ---- */
.palette { display: flex; gap: 8px 18px; flex-wrap: wrap; }
.pgroup { display: flex; flex-direction: column; gap: 4px; }
.plabel { color: var(--lo); font-size: 12px; }
.pchips { display: flex; gap: 6px; align-items: center; }
.chip { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 4px; min-width: 44px; min-height: 44px; touch-action: none; cursor: grab; }
.chip .piece { position: relative; pointer-events: none; }
.ui-canvas > .piece { cursor: grab; touch-action: none; }
.ui-canvas > .piece:active { cursor: grabbing; }
.ui-canvas > .piece:focus-visible { outline: 3px solid var(--yellow); outline-offset: 1px; }
.ui-canvas > .piece.sel { outline: 3px solid var(--yellow); outline-offset: 1px; }
.ui-canvas::after { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; border-left: 2px dashed rgba(0,0,0,.25); pointer-events: none; }
.piece.bad { outline: 3px solid #d33; outline-offset: 1px; }
.piece.removing { opacity: .35; }
.piece.ghost { position: fixed; z-index: 1000; pointer-events: none; opacity: .85; }
.props { display: flex; flex-direction: column; gap: 8px; padding: 10px; background: #b9b9b9;
  border: 3px solid; border-color: var(--slot-lo) var(--hi) var(--hi) var(--slot-lo); }
.props[hidden] { display: none; }
.props-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.props .pbtn-remove { align-self: flex-start; padding: 4px 12px; font-size: 13px; }
dialog label.check { flex-direction: row; align-items: center; gap: 8px; }
dialog label.check input { width: 18px; height: 18px; accent-color: #6f6f6f; }
.io { display: flex; }
.badge { position: absolute; left: 1px; top: 1px; z-index: 3; font-size: 10px; line-height: 1; padding: 2px 3px; color: var(--yellow);
  background: rgba(0,0,0,.65); pointer-events: none; }
#content-rows { display: flex; flex-direction: column; gap: 8px; }
.crow { display: grid; grid-template-columns: 1fr 110px; gap: 6px; padding: 8px; background: #b9b9b9;
  border: 3px solid; border-color: var(--slot-lo) var(--hi) var(--hi) var(--slot-lo); }
.crow-h { grid-column: 1 / -1; font-size: 13px; }
.crow input, .crow select { font-size: 13px; padding: 3px 6px; }
.crow select { grid-column: 1 / -1; }
.preview-wrap { overflow: auto; padding: 8px; background: var(--panel);
  border: 3px solid; border-color: var(--slot-lo) var(--hi) var(--hi) var(--slot-lo); }
.preview-wrap[hidden], #content-wrap[hidden] { display: none; }
.badge.act { background: #2e7d32; }
.bwrap { position: relative; flex: none; }
.bwrap > .block { width: 100%; height: 100%; }
.port { position: absolute; z-index: 6; width: 16px; height: 16px; border: 2px solid #000;
  box-shadow: inset 2px 2px 0 rgba(255,255,255,.5), inset -2px -2px 0 rgba(0,0,0,.35); }
.port.left { left: -10px; } .port.right { right: -10px; }
.port.item { background: #8b8b8b; } .port.fluid { background: #2f5fd0; } .port.energy { background: #b3151b; }
main { position: relative; }
#links { position: absolute; left: 0; top: 0; z-index: 4; pointer-events: none; overflow: visible; }
#links path { fill: none; stroke-width: 4; stroke-linecap: round; pointer-events: stroke; cursor: pointer; }
#links path:hover { stroke-width: 7; }
#links path.tmp { pointer-events: none; opacity: .7; stroke-dasharray: 6 6; }
#links path.item { stroke: #8b8b8b; } #links path.fluid { stroke: #2f5fd0; } #links path.energy { stroke: #b3151b; }
.port { cursor: crosshair; touch-action: none; }
.port.ok { outline: 3px solid var(--yellow); } .port.no { opacity: .35; }
.bwrap { position: absolute; cursor: grab; touch-action: none; }
.bwrap.drag { cursor: grabbing; }
.bwrap .port { cursor: crosshair; }
</style>
</head>
<body>
<header>
  <h1>Production tree</h1>
  <span class="status" id="status" role="status"></span>
  <button id="create-ui" type="button" disabled>Create UI</button>
  <button id="add" type="button" disabled>Create block</button>
</header>
<main id="board"></main>

<dialog id="dlg" aria-labelledby="dlg-title">
  <form id="form">
    <h2 id="dlg-title">Create block</h2>
    <label>Name
      <input type="text" id="name" maxlength="40" autocomplete="off" required>
    </label>
    <div>
      Icon
      <div class="icons" id="icons"></div>
      <div class="hint" id="hint"></div>
    </div>
    <label>UI model
      <select id="ui-select"></select>
    </label>
    <div id="content-wrap" hidden>
      <h3>Content (one entry per slot, numbers as in the preview)</h3>
      <div id="content-rows"></div>
    </div>
    <div class="preview-wrap" id="preview-wrap" hidden><div id="preview"></div></div>
    <div class="size-row">
      <label>Width (px)
        <input type="number" id="w" min="160" max="480" step="1" value="200" required>
      </label>
      <label>Height (px)
        <input type="number" id="h" min="64" max="320" step="1" value="80" required>
      </label>
    </div>
    <div class="hint">Width 160–480, height 64–320. Filled in from the UI model, you can change it.</div>
    <div class="hint" id="err"></div>
    <div class="actions">
      <button type="button" id="cancel">Cancel</button>
      <button type="submit">Create</button>
    </div>
  </form>
</dialog>

<dialog id="ui-dlg" aria-labelledby="ui-title">
  <form id="ui-form">
    <h2 id="ui-title">Create UI</h2>
    <label>Name
      <input type="text" id="ui-name" maxlength="40" autocomplete="off" required>
    </label>
    <div class="size-row">
      <label>UI width (px)
        <input type="number" id="ui-w" min="120" max="420" step="1" value="240" required>
      </label>
      <label>UI height (px)
        <input type="number" id="ui-h" min="40" max="240" step="1" value="120" required>
      </label>
    </div>
    <label class="check"><input type="checkbox" id="ui-darrow" checked> Default arrow in the middle</label>
    <div class="hint">Drag a piece onto the canvas, click it to edit it. Drag it off the canvas to remove it.</div>
    <div class="palette" id="palette"></div>
    <div class="sides" id="sides"><span>Inputs</span><span>Outputs</span></div>
    <div class="canvas-wrap"><div class="ui-canvas" id="ui-canvas"><div class="arrow" id="ui-arrow"></div></div></div>
    <div class="props" id="props" hidden>
      <h3 id="props-title"></h3>
      <div class="props-fields" id="props-fields"></div>
      <button type="button" class="pbtn-remove" id="props-remove">Remove piece</button>
    </div>
    <div class="hint" id="ui-err"></div>
    <div class="actions">
      <button type="button" id="ui-cancel">Cancel</button>
      <button type="submit">Save UI</button>
    </div>
  </form>
</dialog>
<script>
(function () {
  var AMT_MAX = 99999999, SNAP = 4, MAX_PIECES = 32, VERSION = 7;
  var LABEL = { item: 'Item', fluid: 'Fluid', energy: 'FE', button: 'Button', arrow: 'Arrow', flame: 'Flame' };
  var SLOT_TYPES = { item: 1, fluid: 1, energy: 1 };
  var board = document.getElementById('board'), statusEl = document.getElementById('status');
  var addBtn = document.getElementById('add'), uiBtn = document.getElementById('create-ui');
  var dlg = document.getElementById('dlg'), form = document.getElementById('form'), nameIn = document.getElementById('name');
  var wIn = document.getElementById('w'), hIn = document.getElementById('h'), uiSel = document.getElementById('ui-select');
  var iconsEl = document.getElementById('icons'), hint = document.getElementById('hint'), errEl = document.getElementById('err');
  var last = null, selected = null, models = [], wTouched = false, hTouched = false, outdated = false, iconNames = [];

  function clamp(v, lo, hi, def) {
    return typeof v === 'number' && isFinite(v) ? Math.max(lo, Math.min(hi, Math.round(v))) : def;
  }
  function iconUrl(path) {
    path = String(path); if (path.indexOf('/') < 0) path = 'machinery_blocks/' + path;
    return path.split('/').map(encodeURIComponent).join('/');
  }
  function el(tag, cls) { var e = document.createElement(tag); if (cls) e.className = cls; return e; }
  function message(t) { board.innerHTML = ''; var p = el('p', 'empty'); p.textContent = t; board.appendChild(p); }
  async function getJson(url) { return (await fetch(url, { cache: 'no-store' })).json(); }
  async function post(url, body) {
    var r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    var data = null;
    try { data = await r.json(); } catch (e) {}
    if (!data) throw new Error('the running server is outdated: close it and start server.py again');
    if (!r.ok) throw new Error(data.error || 'error');
    return data;
  }

  /* ---------- pieces (shared by blocks and editor) ---------- */
  function pieceSize(p) {
    if (p.type === 'item') return { w: 36, h: 36 };
    if (p.type === 'fluid' || p.type === 'energy') return { w: 24, h: 104 };   /* tall columns */
    if (p.type === 'button') return { w: clamp(p.w, 40, 160, 72), h: 24 };
    if (p.type === 'arrow') return { w: 44, h: 32 };
    return { w: 28, h: 32 };
  }
  function defaults(type) {
    if (type === 'button') return { type: type, text: 'Button', w: 72 };
    if (type === 'arrow') return { type: type, progress: 50 };
    if (type === 'flame') return { type: type, level: 75 };
    return { type: type };
  }
  function compact(n) {
    function trim(s) { return s.replace(/\.0$/, ''); }
    if (n < 10000) return String(n);
    if (n < 100000) return trim((n / 1000).toFixed(1)) + 'k';
    if (n < 1000000) return Math.round(n / 1000) + 'k';
    if (n < 10000000) return trim((n / 1000000).toFixed(1)) + 'M';
    return Math.round(n / 1000000) + 'M';
  }
  function fullAmount(p) {
    var n = p.amount.toLocaleString('en-US');
    return p.type === 'item' ? 'x' + n : p.type === 'fluid' ? n + ' mB' : n + ' FE';
  }
  function pieceEl(p, idx) {
    var sz = pieceSize(p), n = el('div', 'piece');
    n.style.width = sz.w + 'px'; n.style.height = sz.h + 'px';
    if (SLOT_TYPES[p.type]) {
      n.classList.add('su', p.type);
      if (p.icon) {
        n.classList.add('has-img');
        var url = iconUrl(p.icon);
        if (p.type === 'item') {
          var im = el('img'); im.alt = ''; im.src = url;
          im.onerror = function () { im.remove(); n.classList.remove('has-img'); };
          n.appendChild(im);
        } else {                                   /* fluid / FE: the image is tiled down the column */
          n.style.backgroundImage = 'url("' + url + '")';
          var probe = new Image();
          probe.onerror = function () { n.style.backgroundImage = ''; n.classList.remove('has-img'); };
          probe.src = url;
        }
      } else if (p.type === 'item' && p.name) {
        var l = el('span', 'letter'); l.textContent = p.name.charAt(0).toUpperCase(); n.appendChild(l);
      }
      var hasAmt = typeof p.amount === 'number' && p.amount >= 1;
      if (hasAmt && (p.type !== 'item' || p.amount > 1)) {
        var c = el('span', 'cnt'); c.textContent = compact(p.amount); n.appendChild(c);
      }
      n.title = LABEL[p.type] + (p.name ? ': ' + p.name : '') + (hasAmt ? ' (' + fullAmount(p) + ')' : '') + (p.side ? ', ' + p.side : '');
      if (idx) { var bd = el('span', 'badge'); bd.textContent = idx; if (p.active) bd.classList.add('act'); n.appendChild(bd); }
    } else if (p.type === 'button') {
      n.classList.add('pbtn'); var s = el('span'); s.textContent = p.text || 'Button'; n.appendChild(s);
    } else {
      var pct = clamp(p.type === 'arrow' ? p.progress : p.level, 0, 100, 0);
      n.classList.add(p.type === 'arrow' ? 'parrow' : 'pflame');
      var i = el('div', 'pi'), f = el('div', 'pf');
      if (p.type === 'arrow') f.style.width = pct + '%'; else f.style.height = pct + '%';
      i.appendChild(f); n.appendChild(i);
      n.title = p.type === 'arrow' ? 'Progress ' + pct + '%' : 'Fuel ' + pct + '%';
    }
    return n;
  }

  /* ---------- drawing a block ---------- */
  /* content[k] fills the k-th slot of the frame (left to right in the order of the UI model) */
  function uiBox(m, content, preview) {
    var box = el('div', 'uibox'), k = 0;
    box.style.width = m.width + 'px'; box.style.height = m.height + 'px';
    if (m.defaultArrow !== false) {
      var a = el('div', 'arrow'); a.style.left = (m.width / 2 - 13) + 'px'; a.style.top = (m.height / 2 - 8) + 'px'; box.appendChild(a);
    }
    (m.pieces || []).forEach(function (p) {
      var q = p, isSlot = !!SLOT_TYPES[p.type];
      if (isSlot) {
        var c = content && content[k];
        if (c) q = Object.assign({}, p, { name: c.name || '', amount: c.amount == null ? null : c.amount, icon: c.icon || null });
        k++;
      }
      var n = pieceEl(q, preview && isSlot ? k : 0); n.style.left = p.x + 'px'; n.style.top = p.y + 'px'; box.appendChild(n);
    });
    return box;
  }
  function col(list) {
    var c = el('div', 'col');
    list.forEach(function (e) { var r = el('div', 'io'); r.appendChild(pieceEl(e)); c.appendChild(r); });
    return c;
  }
  function blockBody(b) {
    var d = el('div', 'block');
    var head = el('div', 'head');
    if (typeof b.icon === 'string' && b.icon) {
      var im = el('img'); im.alt = ''; im.src = iconUrl(b.icon); im.onerror = function () { im.remove(); };
      head.appendChild(im);
    }
    var t = el('span'); t.textContent = b.name; head.appendChild(t);
    d.appendChild(head);
    if (b.uiModel) { d.appendChild(uiBox(b.uiModel, b.content)); return d; }
    var ins = b.inputs || [], outs = b.outputs || [];   /* blocks made before UI models existed */
    if (ins.length || outs.length) {
      var body = el('div', 'body');
      body.appendChild(col(ins)); body.appendChild(el('div', 'arrow')); body.appendChild(col(outs));
      d.appendChild(body);
    }
    return d;
  }

  /* one square on the left edge per active input slot, one on the right edge per active output slot */
  var UI_TOP = 64;                    /* block border 4 + padding 10 + head 40 + gap 10 */
  function portYs(centers, H) {
    var S = 16, GAP = 6, top = 10, n = centers.length, ys = [];
    if (!n) return ys;
    if (n * S + (n - 1) * GAP > H - 2 * top) {
      var step = n > 1 ? (H - 2 * top - S) / (n - 1) : 0;
      for (var i = 0; i < n; i++) ys.push(top + i * step);
      return ys;
    }
    centers.forEach(function (c, i) { ys.push(Math.max(c - S / 2, i ? ys[i - 1] + S + GAP : top)); });
    var over = ys[n - 1] + S - (H - top);
    if (over > 0) ys = ys.map(function (y, i) { return Math.max(top + i * (S + GAP), y - over); });
    return ys;
  }

  function addPorts(wrap, m, H, file) {
    if (!m) return;
    var all = (m.pieces || []).filter(function (p) { return SLOT_TYPES[p.type]; })
      .map(function (p, k) { return { p: p, k: k }; });          /* k = slot number, 0-based */
    ['input', 'output'].forEach(function (side) {
      var list = all.filter(function (e) { return e.p.side === side && e.p.active; })
        .map(function (e) { return { type: e.p.type, slot: e.k, yc: UI_TOP + e.p.y + pieceSize(e.p).h / 2 }; })
        .sort(function (a, b) { return a.yc - b.yc; });
      var ys = portYs(list.map(function (x) { return x.yc; }), H);
      list.forEach(function (it, i) {
        var port = el('div', 'port ' + (side === 'input' ? 'left ' : 'right ') + it.type);
        port.style.top = ys[i] + 'px';
        port.title = (side === 'input' ? 'Input: ' : 'Output: ') + LABEL[it.type];
        port.dataset.block = file; port.dataset.slot = it.slot; port.dataset.side = side; port.dataset.type = it.type;
        wirePort(port);
        wrap.appendChild(port);
      });
    });
  }
  function drawBlock(b) {
    var H = clamp(b.height, 64, 320, 80), wrap = el('div', 'bwrap');
    wrap.style.width = clamp(b.width, 160, 480, 200) + 'px'; wrap.style.height = H + 'px';
    wrap.appendChild(blockBody(b));
    addPorts(wrap, b.uiModel, H, b.file);
    wireDrag(wrap, b.file);
    return wrap;
  }

  /* ---------- connections ---------- */
  var NS = 'http://www.w3.org/2000/svg', links = [];
  function svgLayer() {
    var s = board.querySelector('#links');
    if (!s) { s = document.createElementNS(NS, 'svg'); s.id = 'links'; board.appendChild(s); }
    s.setAttribute('width', 0); s.setAttribute('height', 0);
    s.setAttribute('width', board.scrollWidth); s.setAttribute('height', board.scrollHeight);
    return s;
  }
  function center(p) {
    var r = p.getBoundingClientRect(), b = board.getBoundingClientRect();
    return { x: r.left - b.left + r.width / 2, y: r.top - b.top + r.height / 2 };
  }
  function curve(a, b) {
    var d = Math.max(40, Math.abs(b.x - a.x) / 2);
    return 'M' + a.x + ' ' + a.y + ' C' + (a.x + d) + ' ' + a.y + ',' + (b.x - d) + ' ' + b.y + ',' + b.x + ' ' + b.y;
  }
  function drawLinks() {
    var s = svgLayer(); s.innerHTML = '';
    var ports = Array.prototype.slice.call(board.querySelectorAll('.port'));
    function find(e) { return ports.filter(function (p) { return p.dataset.block === e.block && p.dataset.slot === String(e.slot); })[0]; }
    links.forEach(function (l) {
      var a = find(l.from), b = find(l.to);
      if (!a || !b) return;

          if (!moved) f = freeSpot(sz);          /* plain click: first free spot */
          else if (inside(e, 0)) {
            var p = canvasPoint(e); f = fit(p.x - sz.w / 2, p.y - sz.h / 2, sz);
            if (overlaps(f.x, f.y, sz, null)) { uiErr.textContent = 'Pieces cannot overlap.'; return; }
          } else return;
          if (!f) { uiErr.textContent = 'No free spot left: make the canvas bigger or remove a piece.'; return; }
          uiErr.textContent = ''; addPiece(data, f);
        }
        chip.addEventListener('pointermove', move); chip.addEventListener('pointerup', up); chip.addEventListener('pointercancel', stop);
      });
      chip.addEventListener('keydown', function (ev) {
        if (ev.key !== 'Enter' && ev.key !== ' ') return;
        ev.preventDefault();
        var data = defaults(type), sz = pieceSize(data), f = freeSpot(sz);
        if (sz.w > cw || sz.h > ch) { uiErr.textContent = 'This piece is ' + sz.w + 'x' + sz.h + ' px: make the UI at least that big.'; return; }
        if (f && pieces.length < MAX_PIECES) addPiece(data, f);
      });
    });
    box.appendChild(chips); palette.appendChild(box);
  });

  function resizeCanvas() {
    var minW = 120, minH = 40;
    pieces.forEach(function (o) { var z = pieceSize(o); minW = Math.max(minW, z.w); minH = Math.max(minH, z.h); });
    cw = clamp(parseInt(uiW.value, 10), minW, 420, cw); ch = clamp(parseInt(uiH.value, 10), minH, 240, ch);
    uiW.value = cw; uiH.value = ch;
    layoutCanvas();
    pieces.forEach(function (s) { var f = fit(s.x, s.y, pieceSize(s)); s.x = f.x; s.y = f.y; setPos(s.el, s); });
  }
  uiW.addEventListener('change', resizeCanvas); uiH.addEventListener('change', resizeCanvas);

  uiBtn.addEventListener('click', function () {
    pieces.slice().forEach(removePiece); select(null);
    uiName.value = ''; uiW.value = 240; uiH.value = 120; uiErr.textContent = ''; darrow.checked = true;
    cw = 240; ch = 120; layoutCanvas();
    uiDlg.showModal(); uiName.focus();
  });
  document.getElementById('ui-cancel').addEventListener('click', function () { uiDlg.close(); });

  uiForm.addEventListener('submit', async function (e) {
    e.preventDefault();
    var name = uiName.value.trim();
    if (!name) { uiName.focus(); return; }
    if (!pieces.length) { uiErr.textContent = 'Drag at least one piece onto the canvas.'; return; }
    var bad = pieces.filter(function (s) { return s.type === 'button' && !(s.text || '').trim(); })[0];
    if (bad) { select(bad); uiErr.textContent = 'A button needs some text.'; return; }
    try {
      var data = await post('/api/uis', { name: name, width: cw, height: ch, defaultArrow: darrow.checked,
        pieces: pieces.map(function (s) { var o = Object.assign({}, s); delete o.el; return o; }) });
      uiDlg.close(); await loadModels();
      statusEl.textContent = 'Saved ' + data.file;
    } catch (err) { uiErr.textContent = 'Could not save the UI: ' + err.message; }
  });
  layoutCanvas();
  loadModels();
})();
</script>
</body>
</html>
